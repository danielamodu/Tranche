[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib"]
test = "contracts/test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "shanghai"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
hashkey = "https://mainnet.hsk.xyz"
hashkey_testnet = "https://testnet.hsk.xyz"

[invariant]
runs = 64
depth = 80
fail_on_revert = false
